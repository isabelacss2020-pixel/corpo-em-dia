# Configuração para publicar o app no Render (render.com).
# No Render: New + > Blueprint > escolher este repositório.
services:
  - type: web
    name: corpo-em-dia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    # Um processo só: o banco é um arquivo SQLite local.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/saude
